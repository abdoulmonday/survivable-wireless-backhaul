[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "survivable-wireless-backhaul"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "networkx>=3.0", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools.packages.find]
where = ["src"]
